name = "aston-os-cloudflare-8-1-3"
main = "index.js"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
PUBLIC_CHAT = "false"
ALLOWED_ORIGIN = "https://www.laneaston.com"
PUBLIC_AGENT = "true"
PUBLIC_AGENT_RATE_LIMIT_PER_MINUTE = "8"
PUBLIC_AGENT = "true"
PUBLIC_AGENT_RATE_LIMIT_PER_MINUTE = "8"

[ai]
binding = "AI"

[[d1_databases]]
binding = "ASTON_DB"
database_name = "aston-omni-primary"
database_id = "51312792-29f1-4930-a185-790fa330fae8"

[[d1_databases]]
binding = "ASTON_DB_BACKUP"
database_name = "aston-omni-backup"
database_id = "5cc9354d-0672-40e3-a7d5-6f2741269dda"

[[r2_buckets]]
binding = "ASTON_R2"
bucket_name = "aston-omni-datalake"

[[kv_namespaces]]
binding = "ASTON_KV"
id = "f0f5b71491c34b80ad8d7365acc6336e"

[durable_objects]
bindings = [
  { name = "ASTON_SESSION", class_name = "AstonSession" },
  { name = "ASTON_RATE_LIMITER", class_name = "AstonRateLimiter" },
  { name = "ASTON_LEDGER_LOCK", class_name = "AstonLedgerLock" },
  { name = "ASTON_AGENT", class_name = "AstonAgent" }
]

[[migrations]]
tag = "v1-extreme"
new_sqlite_classes = ["AstonSession", "AstonRateLimiter", "AstonLedgerLock"]

[[migrations]]
tag = "v2-agent"
new_sqlite_classes = ["AstonAgent"]

[triggers]
crons = ["0 * * * *"]

# OPTIONAL — create first, then uncomment:
#   npx wrangler vectorize create aston-omni-index --dimensions=768 --metric=cosine
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "aston-omni-index"

# OPTIONAL — create first, then uncomment:
#   npx wrangler queues create aston-global-queue
# [[queues.producers]]
# binding = "ASTON_QUEUE"
# queue = "aston-global-queue"
#
# [[queues.consumers]]
# queue = "aston-global-queue"
# max_batch_size = 10
# max_retries = 3
