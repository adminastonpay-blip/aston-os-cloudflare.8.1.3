name = "aston-os-cloudflare-8-1-3"
main = "worker.mjs"
compatibility_date = "2025-10-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
PUBLIC_CHAT = "false"
SOVEREIGN_FAIL_CLOSED = "0"

[ai]
binding = "AI"

[[d1_databases]]
binding = "ASTON_DB"
database_name = "aston-omni-primary"
database_id = "51312792-29f1-4930-a185-790fa330fae8"

[[d1_databases]]
binding = "ASTON_DB_BACKUP"
database_name = "aston-omni-backup"
database_id = "5cc9354d-0672-40e3-a7d5-6f2741269dda"

[[r2_buckets]]
binding = "ASTON_R2"
bucket_name = "aston-omni-datalake"

[[kv_namespaces]]
binding = "ASTON_KV"
id = "f0f5b71491c34b80ad8d7365acc6336e"

[[durable_objects.bindings]]
name = "ASTON_SESSION"
class_name = "AstonSession"

[[durable_objects.bindings]]
name = "ASTON_RATE_LIMITER"
class_name = "AstonRateLimiter"

[[durable_objects.bindings]]
name = "ASTON_LEDGER_LOCK"
class_name = "AstonLedgerLock"

[[durable_objects.bindings]]
name = "ASTON_AGENT"
class_name = "AstonAgent"

[[durable_objects.bindings]]
name = "ASTON_VOICE"
class_name = "AstonVoiceSession"

[[durable_objects.bindings]]
name = "ASTON_ONTOLOGY"
class_name = "AstonOntology"

[[durable_objects.bindings]]
name = "ASTON_ORCHESTRATOR"
class_name = "AstonOrchestrator"

[[migrations]]
tag = "v1-extreme"
new_sqlite_classes = ["AstonSession", "AstonRateLimiter", "AstonLedgerLock"]

[[migrations]]
tag = "v2-agent"
new_sqlite_classes = ["AstonAgent"]

[[migrations]]
tag = "v3-voice"
new_sqlite_classes = ["AstonVoiceSession"]

[[migrations]]
tag = "v4-ontology"
new_sqlite_classes = ["AstonOntology"]

[[migrations]]
tag = "v5-orchestrator"
new_sqlite_classes = ["AstonOrchestrator"]
