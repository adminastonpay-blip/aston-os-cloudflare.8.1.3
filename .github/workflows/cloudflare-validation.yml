name: ASTON OS Cloudflare validation

on:
  push:
    branches: [main, "patch/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Smoke tests
        run: npm test
      - name: Cloudflare dry run
        run: npm run check
